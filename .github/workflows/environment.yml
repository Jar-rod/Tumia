# Stops or starts the AWS environment by hand, so it only costs money while it is being used.
# Manual only: Actions -> Start or stop AWS -> Run workflow. See docs/deploy-setup.md ("Stopping and starting").
name: Start or stop AWS

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [stop, start, status]
        default: stop

permissions:
  contents: read

# Shares the deploy queue, so it never runs at the same time as a deploy.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1
  ENV_NAME: prod

jobs:
  environment:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run ${{ inputs.action }}
        run: .github/scripts/environment.sh "$ACTION" "$ENV_NAME"
        env:
          ACTION: ${{ inputs.action }}
