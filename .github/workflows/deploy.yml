# Deploys to AWS (af-south-1). Manual only: Actions -> Deploy -> Run workflow.
# The tests always run first; nothing deploys if they fail. See docs/deploy-setup.md for the one-off setup.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [auto, frontend, backend, both, infra]
        default: auto

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1
  ENV_NAME: prod
  COVERAGE_MINIMUM: 70
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      backend: ${{ steps.plan.outputs.backend }}
      infra: ${{ steps.plan.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Work out what to deploy
        id: plan
        run: .github/scripts/plan-deploy.sh "$TARGET"
        env:
          TARGET: ${{ inputs.target }}

  # Always runs, whatever the target. Same checks as CI.
  test:
    name: test
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Backend tests with coverage
        working-directory: services/api
        run: |
          dotnet tool restore
          dotnet build -c Release
          dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory TestResults
          dotnet reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -targetdir:TestResults/report -reporttypes:"JsonSummary;MarkdownSummaryGithub"
          cat TestResults/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          ../../.github/scripts/check-coverage.sh TestResults/report/Summary.json "$COVERAGE_MINIMUM"
      - name: Infrastructure tests
        working-directory: infra
        run: dotnet test
      - name: Frontend tests with coverage
        run: |
          if [ ! -f apps/web/package.json ]; then
            echo "No frontend yet (apps/web/package.json does not exist); skipping frontend tests."
            exit 0
          fi
          cd apps/web
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --coverage --coverage.thresholds.lines="$COVERAGE_MINIMUM"

  deploy-infra:
    name: deploy-infra
    needs: [plan, test]
    if: needs.plan.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # af-south-1 is an opt-in region; the action calls the regional STS endpoint for the region given here.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Find the image the API is running
        id: image
        run: echo "tag=$(.github/scripts/current-image-tag.sh "$ENV_NAME")" >> "$GITHUB_OUTPUT"
      - name: Show what will change
        working-directory: infra
        run: ../.github/scripts/cdk.sh diff
        env: &cdk-settings
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
          REPO_OIDC_SUBJECT: ${{ vars.REPO_OIDC_SUBJECT }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          CLOUDFRONT_PREFIX_LIST_ID: ${{ vars.CLOUDFRONT_PREFIX_LIST_ID }}
          ENABLE_BEDROCK: ${{ vars.ENABLE_BEDROCK || 'false' }}
          BEDROCK_INFERENCE_PROFILE_ARN: ${{ vars.BEDROCK_INFERENCE_PROFILE_ARN }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
      - name: Deploy every stack
        working-directory: infra
        run: ../.github/scripts/cdk.sh deploy
        env: *cdk-settings

  deploy-backend:
    name: deploy-backend
    needs: [plan, test]
    if: needs.plan.outputs.backend == 'true'
    # Set the repository variable ARM64_RUNNER to "ubuntu-24.04-arm" if ARM runners are available to this
    # repository: the image then builds natively. Otherwise it builds on x64 under QEMU emulation.
    runs-on: ${{ vars.ARM64_RUNNER || 'ubuntu-latest' }}
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      deployed: ${{ steps.rollout.outputs.deployed }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-qemu-action@v4
        if: vars.ARM64_RUNNER == ''
      - uses: docker/setup-buildx-action@v4
      - name: Build and push the image for linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: services/api
          file: services/api/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ENV_NAME }}-tumiia-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run migrations, then roll out
        id: rollout
        run: |
          .github/scripts/deploy-backend.sh "$ENV_NAME" "$IMAGE"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ENV_NAME }}-tumiia-api:${{ github.sha }}

  deploy-frontend:
    name: deploy-frontend
    needs: [plan, test]
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      deployed: ${{ steps.upload.outputs.deployed }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the frontend exists
        id: app
        run: |
          if [ -f apps/web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No frontend yet (apps/web/package.json does not exist), so the frontend was not deployed."
            echo "### deploy-frontend: skipped — no frontend yet" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build
        if: steps.app.outputs.exists == 'true'
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.app.outputs.exists == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload and clear the CloudFront cache
        id: upload
        if: steps.app.outputs.exists == 'true'
        run: |
          outputs="$(aws cloudformation describe-stacks --stack-name "$ENV_NAME-tumiia-web" --query 'Stacks[0].Outputs')"
          bucket="$(jq -r '.[] | select(.OutputKey == "WebBucketName") | .OutputValue' <<< "$outputs")"
          distribution="$(jq -r '.[] | select(.OutputKey == "DistributionId") | .OutputValue' <<< "$outputs")"
          .github/scripts/deploy-frontend.sh apps/web/dist "$bucket" "$distribution"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  # Marks what was deployed, so the next "auto" run only deploys what changed since.
  tag:
    name: tag
    needs: [plan, deploy-infra, deploy-backend, deploy-frontend]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Push deploy tags
        run: |
          stamp="$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          tags=()
          [ "$INFRA" = "true" ] && tags+=("deploy-infra-$stamp")
          [ "$BACKEND" = "true" ] && tags+=("deploy-backend-$stamp")
          [ "$FRONTEND" = "true" ] && tags+=("deploy-frontend-$stamp")
          if [ ${#tags[@]} -eq 0 ]; then
            echo "Nothing was deployed, so no tags."
            exit 0
          fi
          for tag in "${tags[@]}"; do
            git tag "$tag"
            echo "Tagged $tag" >> "$GITHUB_STEP_SUMMARY"
          done
          git push origin "${tags[@]}"
        env:
          INFRA: ${{ needs.deploy-infra.result == 'success' }}
          BACKEND: ${{ needs.deploy-backend.outputs.deployed }}
          FRONTEND: ${{ needs.deploy-frontend.outputs.deployed }}
